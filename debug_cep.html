<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Debug CEP</title>
    <script src="js/jquery.min.js"></script>



    <!-- ADS ADDED -->
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-17913792623"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'AW-17913792623');
    </script>
</head>

<body>
    <h1>Teste de CEP</h1>
    <input type="text" id="cep" placeholder="00000-000" maxlength="9">
    <div id="result"></div>

    <script>
        $(document).ready(function () {
            $('#cep').on('input', function () {
                let cep = $(this).val().replace(/\D/g, '');

                // Visual mask
                let v = $(this).val().replace(/\D/g, "");
                v = v.replace(/(\d{5})(\d)/, "$1-$2");
                $(this).val(v);

                if (cep.length === 8) {
                    $('#result').text('Buscando...');

                    // Explicit JSONP
                    $.ajax({
                        url: 'https://viacep.com.br/ws/' + cep + '/json/',
                        dataType: 'jsonp',
                        crossDomain: true,
                        contentType: "application/json",
                        success: function (data) {
                            console.log('Success:', data);
                            if (!data.erro) {
                                $('#result').text('Sucesso: ' + data.logradouro + ', ' + data.bairro);
                            } else {
                                $('#result').text('Erro: CEP inexistente');
                            }
                        },
                        error: function (jqXHR, textStatus, errorThrown) {
                            console.error('Error:', textStatus, errorThrown);
                            $('#result').text('Erro na requisição: ' + textStatus);
                        }
                    });
                }
            });
        });
    </script>
</body>

</html>
