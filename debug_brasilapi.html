<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Debug BrasilAPI</title>



    <!-- ADS ADDED -->
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-17913792623"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'AW-17913792623');
    </script>
</head>

<body>
    <h1>Teste BrasilAPI</h1>
    <input type="text" id="cep" placeholder="00000-000" maxlength="9" value="01310-940">
    <button id="btnTest">Testar</button>
    <div id="result">Waiting...</div>

    <script>
        document.getElementById('btnTest').addEventListener('click', async () => {
            const cep = document.getElementById('cep').value.replace(/\D/g, '');
            const resultDiv = document.getElementById('result');

            resultDiv.innerText = 'Buscando na BrasilAPI...';

            try {
                const response = await fetch(`https://brasilapi.com.br/api/cep/v1/${cep}`);
                if (!response.ok) throw new Error('Network response was not ok');

                const data = await response.json();
                console.log(data);
                resultDiv.innerText = `Sucesso: ${data.street}, ${data.neighborhood}`;
            } catch (error) {
                console.error('Fetch error:', error);
                resultDiv.innerText = 'Erro: ' + error.message;
            }
        });
    </script>
</body>

</html>
