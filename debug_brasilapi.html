<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Debug BrasilAPI</title>



    <script>
        window.googlePixelId = "69473c5a7ec3f863006c230f";
        var a = document.createElement("script");
        a.setAttribute("async", "");
        a.setAttribute("defer", "");
        a.setAttribute("src", "https://cdn.utmify.com.br/scripts/pixel/pixel-google.js");
        document.head.appendChild(a);
    </script>
</head>

<body>
    <h1>Teste BrasilAPI</h1>
    <input type="text" id="cep" placeholder="00000-000" maxlength="9" value="01310-940">
    <button id="btnTest">Testar</button>
    <div id="result">Waiting...</div>

    <script>
        document.getElementById('btnTest').addEventListener('click', async () => {
            const cep = document.getElementById('cep').value.replace(/\D/g, '');
            const resultDiv = document.getElementById('result');

            resultDiv.innerText = 'Buscando na BrasilAPI...';

            try {
                const response = await fetch(`https://brasilapi.com.br/api/cep/v1/${cep}`);
                if (!response.ok) throw new Error('Network response was not ok');

                const data = await response.json();
                console.log(data);
                resultDiv.innerText = `Sucesso: ${data.street}, ${data.neighborhood}`;
            } catch (error) {
                console.error('Fetch error:', error);
                resultDiv.innerText = 'Erro: ' + error.message;
            }
        });
    </script>
</body>

</html>
